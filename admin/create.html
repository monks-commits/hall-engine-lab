<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Створення сеансу</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  padding:24px;
  background:#f1f5f9;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
}

h1{margin:0 0 10px}

.card{
  background:#fff;
  border-radius:14px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 6px 20px rgba(0,0,0,.08);
}

.row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
}

input,select,button,textarea{
  padding:8px 10px;
  font-size:14px;
}

button{
  cursor:pointer;
  border-radius:10px;
  border:1px solid #cbd5f5;
  background:#e5e7eb;
  font-weight:700;
}

button.primary{
  background:#22c55e;
  color:#052e16;
  border-color:#22c55e;
}

textarea{
  width:100%;
  height:260px;
  font-family:monospace;
}

.rule{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:6px;
}

.color{
  width:16px;
  height:16px;
  border-radius:4px;
  border:1px solid #000;
}
</style>
</head>

<body>

<h1>🎛 Створення → Редактор сеансу</h1>

<div class="card">
  <div class="row">
    <label>Seance ID</label>
    <input id="seanceId" placeholder="show-2026-02-10-19-00" style="flex:1">
    <button onclick="newSeance()">Новий</button>
    <button onclick="loadLocal()">Завантажити</button>
  </div>
</div>

<!-- ===== RULES ===== -->
<div class="card">
  <h3>➕ Правило по рядах</h3>

  <div class="row">
    <select id="zone">
      <option value="P">Партер</option>
      <option value="A">Амфітеатр</option>
      <option value="B">Балкон</option>
    </select>

    <input id="fromRow" type="number" placeholder="від">
    <input id="toRow" type="number" placeholder="до">
    <input id="price" type="number" placeholder="ціна">
    <input id="color" type="color" value="#9333ea">

    <label>
      <input type="checkbox" id="sale" checked>
      Продається
    </label>

    <button class="primary" onclick="addRule()">Додати</button>
  </div>
</div>

<div class="card">
  <h3>📋 Правила</h3>
  <div id="rulesList"></div>
</div>

<!-- ===== SEAT OVERRIDE ===== -->
<div class="card">
  <h3>🎯 Окреме місце</h3>

  <div class="row">
    <input id="seatKey" placeholder="P3-M5">
    <input id="seatPrice" type="number" placeholder="ціна">
    <input id="seatColor" type="color" value="#ef4444">

    <label>
      <input type="checkbox" id="seatSale">
      Заборонити продаж
    </label>

    <button onclick="addSeat()">Додати</button>
  </div>
</div>

<!-- ===== JSON ===== -->
<div class="card">
  <h3>📄 seance.json</h3>
  <textarea id="output"></textarea>

  <div class="row">
    <button onclick="saveLocal()">💾 Зберегти локально</button>
    <button onclick="copy()">📋 Скопіювати</button>
  </div>
</div>

<script>
const data = {
  pricing:{},
  seat_overrides:{}
};

function render(){
  output.value = JSON.stringify({
    seance_id: seanceId.value.trim(),
    pricing: data.pricing,
    seat_overrides: data.seat_overrides
  }, null, 2);

  rulesList.innerHTML = Object.entries(data.pricing).map(([k,v])=>`
    <div class="rule">
      <span class="color" style="background:${v.color}"></span>
      <b>${k}</b>
      <span>${v.price} грн</span>
      <span>${v.sale===false?"❌":"✔"}</span>
      <button onclick="delRule('${k}')">✖</button>
    </div>
  `).join("") || "<i>Поки що немає правил</i>";
}

function addRule(){
  const z = zone.value;
  const f = +fromRow.value;
  const t = +toRow.value;
  const p = +price.value;
  const c = color.value;
  const saleAllowed = sale.checked;

  if(!z||!f||!t||!p) return alert("Заповни всі поля");
  if(f>t) return alert("Невірний діапазон");

  data.pricing[`${z}${f}-${t}`] = {price:p,color:c,sale:saleAllowed};
  render();
}

function delRule(k){
  delete data.pricing[k];
  render();
}

function addSeat(){
  const k = seatKey.value.trim();
  if(!k) return;

  data.seat_overrides[k] = {
    price:+seatPrice.value||0,
    color:seatColor.value,
    sale:!seatSale.checked
  };
  render();
}

function newSeance(){
  if(!confirm("Очистити редактор?")) return;
  data.pricing={};
  data.seat_overrides={};
  output.value="";
}

function saveLocal(){
  if(!seanceId.value) return alert("Немає Seance ID");
  localStorage.setItem("seance_"+seanceId.value, output.value);
  alert("Збережено локально");
}

function loadLocal(){
  const raw = localStorage.getItem("seance_"+seanceId.value);
  if(!raw) return alert("Не знайдено");
  const obj = JSON.parse(raw);
  data.pricing = obj.pricing||{};
  data.seat_overrides = obj.seat_overrides||{};
  render();
}

function copy(){
  output.select();
  document.execCommand("copy");
  alert("Скопійовано");
}
</script>

</body>
</html>
