<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>VA Hall Builder</title>

<style>
  body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
  }

  .layout{
    display:grid;
    grid-template-columns:320px 1fr;
    height:100vh;
  }

  .sidebar{
    background:#fff;
    border-right:1px solid #d1d5db;
    padding:16px;
    overflow:auto;
  }

  .sidebar h1{
    margin:0 0 16px;
    font-size:22px;
  }

  .field{
    margin-bottom:14px;
  }

  .field label{
    display:block;
    font-size:13px;
    margin-bottom:6px;
    color:#4b5563;
  }

  .field input,
  .field select,
  .field textarea{
    width:100%;
    box-sizing:border-box;
    padding:10px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:14px;
  }

  .field textarea{
    min-height:180px;
    font-family:monospace;
  }

  .btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#111827;
    color:#fff;
    font-weight:700;
    cursor:pointer;
    margin-bottom:10px;
  }

  .btn:hover{
    opacity:.92;
  }

  .canvas-wrap{
    position:relative;
    overflow:auto;
    background:#e5e7eb;
  }

  #canvas{
    position:relative;
    margin:0 auto;
    transform-origin:top left;
  }

  #hall-image{
    display:block;
    user-select:none;
    pointer-events:none;
  }

  .seat-dot{
    position:absolute;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#dc2626;
    border:2px solid #fff;
    transform:translate(-50%,-50%);
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
  }

  .seat-label{
    position:absolute;
    transform:translate(-50%, -160%);
    font-size:10px;
    font-weight:700;
    background:#fff;
    padding:1px 4px;
    border-radius:4px;
    border:1px solid #d1d5db;
    pointer-events:none;
  }

  .topbar{
    position:sticky;
    top:0;
    background:#fff;
    border-bottom:1px solid #d1d5db;
    padding:10px;
    z-index:10;
  }

  .counter{
    font-size:14px;
    color:#374151;
    margin-top:6px;
  }

.seat-dot.is-selected{
  background:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.25);
}

.select-box{
  position:absolute;
  border:2px dashed #2563eb;
  background:rgba(37,99,235,.12);
  pointer-events:none;
  z-index:20;
}
  
</style>
</head>

<body>

<div class="layout">

  <aside class="sidebar">

    <h1>Hall Builder</h1>

    <div class="field">
      <label>Завантажити схему</label>
      <input type="file" id="imageLoader" accept="image/*">
    </div>

    <div class="field">
      <label>Zone</label>
      <input type="text" id="zone" value="Партер">
    </div>

    <div class="field">
      <label>Prefix</label>
      <input type="text" id="prefix" value="P">
    </div>

    <div class="field">
      <label>Ряд</label>
      <input type="text" id="row" value="1">
    </div>

    <div class="field">
      <label>Место</label>
      <input type="text" id="seat" value="1">
    </div>

<div class="field">
  <label>Mode</label>

  <select id="mode">
    <option value="seat">Seat</option>
    <option value="label">Label</option>
    <option value="stage">Stage</option>
    <option value="row">Row</option>
    <option value="arc">Arc</option>
    <option value="move">Move</option> 
    <option value="select">Select</option>
  </select>
</div>

<div class="field">
  <label>Decor Text</label>
  <input type="text" id="decorText" value="ПАРТЕР">
</div>

<div class="field">
  <label>Rotate</label>
  <input type="text" id="decorRotate" value="0">
</div>

<div class="field">
  <label>Stage Width</label>
  <input type="text" id="stageW" value="420">
</div>

<div class="field">
  <label>Stage Height</label>
  <input type="text" id="stageH" value="70">
</div>

<div class="field">
  <label>Seats In Row</label>
  <input type="text" id="rowCount" value="20">
</div>

<div class="field">
  <label>Seat Step</label>
  <input type="text" id="seatStep" value="36">
</div>

<div class="field">
  <label>Row Direction</label>
  <select id="rowDirection">
    <option value="right">Right →</option>
    <option value="left">Left ←</option>
  </select>
</div>
 <div class="field">
  <label>Arc Radius</label>
  <input type="text" id="arcRadius" value="220">
</div>

<div class="field">
  <label>Arc Angle</label>
  <input type="text" id="arcAngle" value="120">
</div>   
    <button class="btn" id="exportBtn">
      EXPORT JSON
    </button>

<button class="btn" id="importBtn">
  IMPORT JSON
</button>

<button class="btn" id="undoBtn">
  UNDO LAST
</button>

<button class="btn" id="deleteSelectedBtn">
  DELETE SELECTED
</button>
    
    <button class="btn" id="clearBtn">
      CLEAR ALL
    </button>

    <div class="counter" id="counter">
      Мест: 0
    </div>

    <div class="field">
      <label>JSON</label>
      <textarea id="jsonOutput"></textarea>
    </div>

  </aside>

  <main class="canvas-wrap">

    <div class="topbar">
      Клик по схеме = добавить место
    </div>

    <div id="canvas">

      <img id="hall-image">

    </div>

  </main>

</div>

<script>
const imageLoader = document.getElementById("imageLoader");
const hallImage   = document.getElementById("hall-image");
const canvas      = document.getElementById("canvas");

const rowInput    = document.getElementById("row");
const seatInput   = document.getElementById("seat");
const zoneInput   = document.getElementById("zone");
const prefixInput = document.getElementById("prefix");
const modeInput   = document.getElementById("mode");

const decorTextInput   = document.getElementById("decorText");
const decorRotateInput = document.getElementById("decorRotate");
const stageWInput      = document.getElementById("stageW");
const stageHInput      = document.getElementById("stageH");

const rowCountInput     = document.getElementById("rowCount");
const seatStepInput     = document.getElementById("seatStep");
const rowDirectionInput = document.getElementById("rowDirection");
const arcRadiusInput    = document.getElementById("arcRadius");
const arcAngleInput     = document.getElementById("arcAngle");

const jsonOutput = document.getElementById("jsonOutput");
const counter    = document.getElementById("counter");

const exportBtn = document.getElementById("exportBtn");
const importBtn = document.getElementById("importBtn");
const undoBtn   = document.getElementById("undoBtn");
const deleteSelectedBtn = document.getElementById("deleteSelectedBtn");  
const clearBtn  = document.getElementById("clearBtn");

let seats = [];
let decor = [];
let draggedElement = null;

let selectedSeats = new Set();
let selectBox = null;
let selectStart = null;  

function toInt(el, fallback = 0){
  const n = parseInt(el?.value, 10);
  return Number.isFinite(n) ? n : fallback;
}

function toFloat(el, fallback = 0){
  const n = parseFloat(el?.value);
  return Number.isFinite(n) ? n : fallback;
}

imageLoader.addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = ev => {
    hallImage.src = ev.target.result;

    hallImage.onload = () => {
      canvas.style.width  = hallImage.naturalWidth + "px";
      canvas.style.height = hallImage.naturalHeight + "px";
    };
  };

  reader.readAsDataURL(file);
});

canvas.addEventListener("mousedown", e => {
  if (modeInput.value !== "select") return;
  if (!hallImage.src) return;

  const rect = canvas.getBoundingClientRect();

  selectStart = {
    x: Math.round(e.clientX - rect.left),
    y: Math.round(e.clientY - rect.top)
  };

  selectedSeats.clear();
  document.querySelectorAll(".seat-dot").forEach(el => {
    el.classList.remove("is-selected");
  });

  selectBox = document.createElement("div");
  selectBox.className = "select-box";
  selectBox.style.left = selectStart.x + "px";
  selectBox.style.top = selectStart.y + "px";
  selectBox.style.width = "0px";
  selectBox.style.height = "0px";

  canvas.appendChild(selectBox);
});

canvas.addEventListener("mousemove", e => {
  if (!selectBox || !selectStart) return;

  const rect = canvas.getBoundingClientRect();

  const x = Math.round(e.clientX - rect.left);
  const y = Math.round(e.clientY - rect.top);

  const left = Math.min(selectStart.x, x);
  const top = Math.min(selectStart.y, y);
  const width = Math.abs(x - selectStart.x);
  const height = Math.abs(y - selectStart.y);

  selectBox.style.left = left + "px";
  selectBox.style.top = top + "px";
  selectBox.style.width = width + "px";
  selectBox.style.height = height + "px";
});

canvas.addEventListener("mouseup", () => {
  if (!selectBox) return;

  const box = selectBox.getBoundingClientRect();

  document.querySelectorAll(".seat-dot").forEach(dot => {
    const r = dot.getBoundingClientRect();

    const inside =
      r.left >= box.left &&
      r.right <= box.right &&
      r.top >= box.top &&
      r.bottom <= box.bottom;

    if (inside) {
      dot.classList.add("is-selected");
      selectedSeats.add(`${dot.dataset.x}:${dot.dataset.y}`);
    }
  });

  selectBox.remove();
  selectBox = null;
  selectStart = null;

  updateCounter();
});
  
canvas.addEventListener("click", e => {
  if (!hallImage.src) return;

  if (
    e.target.classList.contains("seat-dot") ||
    e.target.classList.contains("decor-label") ||
    e.target.classList.contains("decor-stage")
  ) {
    return;
  }

  const rect = canvas.getBoundingClientRect();
  const x = Math.round(e.clientX - rect.left);
  const y = Math.round(e.clientY - rect.top);

  const mode = modeInput.value;

  if (mode === "label") {
    const item = {
      type: "label",
      text: decorTextInput.value.trim() || "LABEL",
      x,
      y,
      rotate: Number(decorRotateInput.value || 0)
    };

    decor.push(item);
    renderDecorItem(item);
    updateCounter();
    return;
  }

  if (mode === "stage") {
    const item = {
      type: "stage",
      text: decorTextInput.value.trim() || "СЦЕНА",
      x,
      y,
      w: Number(stageWInput.value || 420),
      h: Number(stageHInput.value || 70)
    };

    decor.push(item);
    renderDecorItem(item);
    updateCounter();
    return;
  }

  if (mode === "row") {
    const row = toInt(rowInput);
    const startSeat = toInt(seatInput);
    const count = toInt(rowCountInput, 1);
    const step = toInt(seatStepInput, 36);
    const dir = rowDirectionInput.value;

    for (let i = 0; i < count; i++) {
      const item = {
        zone: zoneInput.value.trim(),
        prefix: prefixInput.value.trim(),
        row,
        seat: startSeat + i,
        x: dir === "left" ? x - (i * step) : x + (i * step),
        y
      };

      seats.push(item);
      renderSeat(item);
    }

    seatInput.value = startSeat + count;
    updateCounter();
    return;
  }

  if (mode === "arc") {
    const row = toInt(rowInput);
    const startSeat = toInt(seatInput);
    const count = toInt(rowCountInput, 1);
    const radius = toInt(arcRadiusInput, 220);
    const totalAngle = toFloat(arcAngleInput, 120);
    const startAngle = -totalAngle / 2;

    for (let i = 0; i < count; i++) {
      const t = count <= 1 ? 0 : i / (count - 1);
      const angle = (startAngle + (t * totalAngle)) * Math.PI / 180;

      const item = {
        zone: zoneInput.value.trim(),
        prefix: prefixInput.value.trim(),
        row,
        seat: startSeat + i,
        x: Math.round(x + Math.cos(angle) * radius),
        y: Math.round(y + Math.sin(angle) * radius)
      };

      seats.push(item);
      renderSeat(item);
    }

    seatInput.value = startSeat + count;
    updateCounter();
    return;
  }

  if (mode === "move") return;

  const row = toInt(rowInput);
  const seat = toInt(seatInput);

  const item = {
    zone: zoneInput.value.trim(),
    prefix: prefixInput.value.trim(),
    row,
    seat,
    x,
    y
  };

  seats.push(item);
  renderSeat(item);

  seatInput.value = seat + 1;
  updateCounter();
});

canvas.addEventListener("dragover", e => {
  e.preventDefault();
});

canvas.addEventListener("drop", e => {
  e.preventDefault();

  if (!draggedElement) return;

  const rect = canvas.getBoundingClientRect();
  const x = Math.round(e.clientX - rect.left);
  const y = Math.round(e.clientY - rect.top);

  draggedElement.item.x = x;
  draggedElement.item.y = y;

  draggedElement.el.style.left = x + "px";
  draggedElement.el.style.top = y + "px";

  if (draggedElement.label) {
    draggedElement.label.style.left = x + "px";
    draggedElement.label.style.top = y + "px";
  }

  draggedElement = null;
});

function renderSeat(item){
  const dot = document.createElement("div");
  dot.className = "seat-dot";
  dot.draggable = true;

  dot.style.left = item.x + "px";
  dot.style.top  = item.y + "px";

  dot.dataset.row = item.row;
  dot.dataset.seat = item.seat;
  dot.dataset.x = item.x;
  dot.dataset.y = item.y;

  const label = document.createElement("div");
  label.className = "seat-label";
  label.style.left = item.x + "px";
  label.style.top  = item.y + "px";
  label.textContent = item.row + "/" + item.seat;

  dot.addEventListener("dragstart", () => {
    draggedElement = {
      type: "seat",
      item,
      el: dot,
      label
    };
  });

  dot.addEventListener("click", ev => {
    ev.stopPropagation();

    seats = seats.filter(s =>
      !(Number(s.x) === Number(item.x) && Number(s.y) === Number(item.y))
    );

    dot.remove();
    label.remove();
    updateCounter();
  });

  canvas.appendChild(dot);
  canvas.appendChild(label);
}

function renderDecorItem(item){
  if (item.type === "label") {
    const el = document.createElement("div");
    el.className = "decor-label";

    el.style.position = "absolute";
    el.style.left = item.x + "px";
    el.style.top = item.y + "px";
    el.style.transform = `translate(-50%, -50%) rotate(${Number(item.rotate || 0)}deg)`;
    el.style.fontSize = "42px";
    el.style.fontWeight = "900";
    el.style.color = "#111827";
    el.style.cursor = "pointer";
    el.style.userSelect = "none";

    el.textContent = item.text || "";

    el.draggable = true;

    el.addEventListener("dragstart", () => {
      draggedElement = {
        type: "decor",
        item,
        el,
        label: null
      };
    });

    el.addEventListener("click", ev => {
      ev.stopPropagation();

      decor = decor.filter(d =>
        !(Number(d.x) === Number(item.x) && Number(d.y) === Number(item.y))
      );

      el.remove();
      updateCounter();
    });

    canvas.appendChild(el);
    return;
  }

  if (item.type === "stage") {
    const stage = document.createElement("div");
    stage.className = "decor-stage";

    stage.style.position = "absolute";
    stage.style.left = item.x + "px";
    stage.style.top = item.y + "px";
    stage.style.width = (item.w || 420) + "px";
    stage.style.height = (item.h || 70) + "px";
    stage.style.borderRadius = "999px";
    stage.style.background = "#7f1d1d";
    stage.style.color = "#fff";
    stage.style.display = "flex";
    stage.style.alignItems = "center";
    stage.style.justifyContent = "center";
    stage.style.fontWeight = "800";
    stage.style.letterSpacing = ".08em";
    stage.style.cursor = "pointer";
    stage.style.userSelect = "none";

    stage.textContent = item.text || "СЦЕНА";
    stage.draggable = true;

    stage.addEventListener("dragstart", () => {
      draggedElement = {
        type: "decor",
        item,
        el: stage,
        label: null
      };
    });

    stage.addEventListener("click", ev => {
      ev.stopPropagation();

      decor = decor.filter(d =>
        !(Number(d.x) === Number(item.x) && Number(d.y) === Number(item.y))
      );

      stage.remove();
      updateCounter();
    });

    canvas.appendChild(stage);
  }
}

function clearRendered(){
  document
    .querySelectorAll(".seat-dot,.seat-label,.decor-label,.decor-stage")
    .forEach(el => el.remove());
}

function updateCounter(){
  counter.innerHTML = `Мест: ${seats.length}<br>Decor: ${decor.length}`;
}

exportBtn.addEventListener("click", () => {
  const result = {
    version: 1,
    format: "builder",
    generated: true,
    title: "Назва залу",
    width: hallImage.naturalWidth || hallImage.width || 1200,
    height: hallImage.naturalHeight || hallImage.height || 900,
    seats,
    decor
  };

  jsonOutput.value = JSON.stringify(result, null, 2);
});

importBtn.addEventListener("click", () => {
  try {
    const data = JSON.parse(jsonOutput.value);

    seats = Array.isArray(data?.seats)
      ? data.seats
      : Array.isArray(data)
        ? data
        : [];

    decor = Array.isArray(data?.decor)
      ? data.decor
      : [];

    clearRendered();

    seats.forEach(renderSeat);
    decor.forEach(renderDecorItem);

    updateCounter();
  } catch (e) {
    alert("JSON не прочитался");
    console.error(e);
  }
});

undoBtn.addEventListener("click", () => {
  const mode = modeInput.value;

  if (mode !== "seat" && decor.length) {
    decor.pop();
  } else if (seats.length) {
    const last = seats.pop();
    rowInput.value = last.row;
    seatInput.value = last.seat;
  }

  clearRendered();
  seats.forEach(renderSeat);
  decor.forEach(renderDecorItem);
  updateCounter();
});

clearBtn.addEventListener("click", () => {
  seats = [];
  decor = [];
  clearRendered();
  updateCounter();
  jsonOutput.value = "";
});
</script>

</body>
</html>
