<!DOCTYPE html>

<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VA Hall Studio V2 — Stable Build</title>
<style>
:root{--bg:#f3f4f6;--panel:#fff;--line:#d1d5db;--text:#111827;--muted:#6b7280;--blue:#2563eb;--red:#dc2626;--orange:#f97316;--green:#16a34a;--purple:#7c3aed;--gray:#6b7280;}
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
.layout{display:grid;grid-template-columns:340px 1fr 340px;height:100vh}.sidebar,.rightbar{background:var(--panel);padding:14px;overflow:auto}.sidebar{border-right:1px solid var(--line)}.rightbar{border-left:1px solid var(--line)}
h1{margin:0 0 12px;font-size:22px} h2{margin:18px 0 10px;padding-top:12px;border-top:1px solid var(--line);font-size:15px}.field{margin-bottom:10px}.field label{display:block;margin-bottom:5px;font-size:12px;font-weight:800;color:#4b5563}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff}.field textarea{min-height:260px;font-family:Consolas,monospace;font-size:12px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.btn{width:100%;padding:11px;margin-bottom:8px;border:none;border-radius:10px;background:#111827;color:#fff;font-weight:900;cursor:pointer}.btn:hover{opacity:.92}.blue{background:var(--blue)}.red{background:var(--red)}.green{background:var(--green)}.orange{background:var(--orange)}.purple{background:var(--purple)}
.canvas-wrap{position:relative;overflow:auto;background:#e5e7eb}.topbar{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;justify-content:space-between;gap:12px;font-size:14px}.hint{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#canvas{position:relative;margin:30px auto;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.13);touch-action:none;user-select:none}#hall-image{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none;z-index:1}.grid{position:absolute;inset:0;pointer-events:none;z-index:2;display:none;background-image:linear-gradient(to right,rgba(37,99,235,.15) 1px,transparent 1px),linear-gradient(to bottom,rgba(37,99,235,.15) 1px,transparent 1px);background-size:20px 20px}.select-box{position:absolute;border:2px dashed var(--blue);background:rgba(37,99,235,.12);z-index:90;pointer-events:none}
.seat-dot{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--red);border:2px solid #fff;transform:translate(-50%,-50%);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.22);z-index:20}.seat-dot.selected{background:var(--blue)!important;box-shadow:0 0 0 4px rgba(37,99,235,.22),0 2px 8px rgba(0,0,0,.22)}.seat-dot.sold{background:var(--gray)!important}.seat-dot.hold{background:var(--orange)!important}.seat-dot.reserved{background:#991b1b!important}.seat-label{position:absolute;transform:translate(-50%,-160%);font-size:10px;font-weight:900;background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 4px;pointer-events:none;z-index:21}.decor-label,.decor-stage,.decor-path{position:absolute;z-index:10;cursor:pointer}.decor-label{transform:translate(-50%,-50%);font-size:40px;font-weight:900;white-space:nowrap}.decor-stage{display:flex;align-items:center;justify-content:center;background:#7f1d1d;color:#fff;border-radius:999px;font-weight:900;letter-spacing:.08em}.selected-decor{outline:3px solid rgba(37,99,235,.45)}
.counter,.log,.preview{font-size:13px;line-height:1.45;color:#374151;background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0 12px}.log{white-space:pre-wrap;min-height:120px;font-family:Consolas,monospace;font-size:12px}.mini{position:fixed;right:355px;bottom:18px;width:180px;height:130px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 20px rgba(0,0,0,.15);z-index:120}.mini canvas{width:100%;height:100%}.note{font-size:12px;color:var(--muted);line-height:1.4}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
<h1>VA Hall Studio V2</h1>
<div class="field"><label>Завантажити фон</label><input type="file" id="imageLoader" accept="image/*"></div>
<div class="row2"><div class="field"><label>Canvas W</label><input type="number" id="canvasW" value="1200"></div><div class="field"><label>Canvas H</label><input type="number" id="canvasH" value="900"></div></div>
<button class="btn" id="applyCanvasBtn">APPLY CANVAS SIZE</button>
<h2>Seat Data</h2>
<div class="field"><label>Zone</label><input id="zone" value="Партер"></div>
<div class="row3"><div class="field"><label>Prefix</label><input id="prefix" value="P"></div><div class="field"><label>Row</label><input type="number" id="row" value="1"></div><div class="field"><label>Seat</label><input type="number" id="seat" value="1"></div></div>
<div class="row2"><div class="field"><label>Price</label><input type="number" id="price" value="0"></div><div class="field"><label>Color</label><input id="seatColor" value="#dc2626"></div></div>
<div class="field"><label>Mode</label><select id="mode"><option value="seat">Seat</option><option value="row">Row</option><option value="arc">Arc</option><option value="label">Label</option><option value="stage">Stage</option><option value="path">Path</option><option value="select">Select</option><option value="move">Move</option></select></div>
<h2>Row / Arc</h2>
<div class="row2"><div class="field"><label>Seats In Row</label><input type="number" id="rowCount" value="20"></div><div class="field"><label>Seat Step</label><input type="number" id="seatStep" value="36"></div></div>
<div class="row2"><div class="field"><label>Aisle After Every</label><input type="number" id="aisleEvery" value="10"></div><div class="field"><label>Aisle Size px</label><input type="number" id="aisleSize" value="80"></div></div>
<div class="row2"><div class="field"><label>Direction</label><select id="direction"><option value="right">Right →</option><option value="left">Left ←</option><option value="center">From Center</option></select></div><div class="field"><label>Arc Radius</label><input type="number" id="arcRadius" value="220"></div></div>
<div class="field"><label>Arc Angle</label><input type="number" id="arcAngle" value="120"></div>
<h2>Decor</h2>
<div class="field"><label>Decor Text</label><input id="decorText" value="ПАРТЕР"></div>
<div class="row3"><div class="field"><label>Rotate</label><input type="number" id="decorRotate" value="0"></div><div class="field"><label>Stage W</label><input type="number" id="stageW" value="420"></div><div class="field"><label>Stage H</label><input type="number" id="stageH" value="70"></div></div>
<h2>Grid</h2>
<div class="row2"><div class="field"><label>Grid Size</label><input type="number" id="gridSize" value="20"></div><div class="field"><label>Snap</label><select id="snap"><option value="0">Off</option><option value="1">On</option></select></div></div>
<button class="btn blue" id="gridBtn">TOGGLE GRID</button>
<h2>Actions</h2>
<button class="btn blue" id="moveBtn">MOVE SELECTED MODE</button><button class="btn green" id="copyBtn">COPY SELECTED</button><button class="btn green" id="pasteBtn">PASTE</button><button class="btn purple" id="mirrorBtn">MIRROR SELECTED</button><button class="btn orange" id="numberBtn">AUTO NUMBER SELECTED</button><button class="btn red" id="deleteBtn">DELETE SELECTED</button><button class="btn" id="undoBtn">UNDO</button><button class="btn red" id="clearBtn">CLEAR ALL</button>
<div class="counter" id="counter"></div>
</aside>
<main class="canvas-wrap" id="canvasWrap"><div class="topbar"><b id="modeTitle">Mode: Seat</b><span class="hint" id="hint">Клик по пустому месту = добавить место</span></div><div id="canvas"><img id="hall-image"><div class="grid" id="grid"></div></div></main>
<aside class="rightbar">
<h2>Export / Import</h2><button class="btn" id="exportBtn">EXPORT JSON</button><button class="btn" id="importBtn">IMPORT JSON</button><button class="btn green" id="cleanBtn">JSON CLEANER</button><button class="btn orange" id="validateBtn">HALL VALIDATOR</button><button class="btn purple" id="previewBtn">CASH PREVIEW</button>
<div class="field"><label>JSON</label><textarea id="jsonOutput"></textarea></div>
<h2>Hybrid Test</h2><div class="row3"><button class="btn orange" id="holdBtn">HOLD</button><button class="btn" id="soldBtn">SOLD</button><button class="btn red" id="reservedBtn">RESERVED</button></div><button class="btn green" id="statusClearBtn">CLEAR STATUS</button>
<h2>Image Trace</h2><div class="note">Черновой режим: работает по контрастным тёмным точкам на чистой схеме.</div><div class="row2"><div class="field"><label>Trace Step</label><input type="number" id="traceStep" value="14"></div><div class="field"><label>Threshold</label><input type="number" id="traceThreshold" value="80"></div></div><button class="btn purple" id="traceBtn">RUN IMAGE TRACE</button>
<h2>Preview</h2><div class="preview" id="preview"></div><h2>Log</h2><div class="log" id="log"></div>
</aside>
</div>
<div class="mini"><canvas id="miniCanvas" width="180" height="130"></canvas></div>
<script>
const $=id=>document.getElementById(id);
const imageLoader=$('imageLoader'), hallImage=$('hall-image'), canvas=$('canvas'), canvasWrap=$('canvasWrap'), grid=$('grid');
const mode=$('mode'), modeTitle=$('modeTitle'), hint=$('hint'), counter=$('counter'), logBox=$('log'), preview=$('preview'), jsonOutput=$('jsonOutput'), miniCanvas=$('miniCanvas');
let seats=[], decor=[], paths=[], selected=new Set(), history=[], clipboard=[], idn=1;
let drag=null, selectBox=null, selectStart=null, pathDraft=[], gridShown=false;
function uid(p){return p+'_'+Date.now()+'_'+(idn++);} function n(id,fb=0){const v=parseFloat($(id).value);return Number.isFinite(v)?v:fb;} function val(id){return String($(id).value||'').trim();}
function save(){history.push(JSON.stringify({seats,decor,paths}));if(history.length>80)history.shift();}
function log(t){logBox.textContent=t||'';} function cw(){return parseInt(canvas.style.width)||1200} function ch(){return parseInt(canvas.style.height)||900}
function snap(v){if($('snap').value!=='1')return Math.round(v);const g=Math.max(1,n('gridSize',20));return Math.round(v/g)*g;}
function point(e){const r=canvas.getBoundingClientRect();return{x:snap(e.clientX-r.left),y:snap(e.clientY-r.top)}}
function seatKey(s){return `${s.prefix||''}${s.row}-M${s.seat}`}
function all(){return[...seats,...decor,...paths]} function selSeats(){return seats.filter(s=>selected.has(s.id))}
function applyCanvas(){canvas.style.width=n('canvasW',1200)+'px';canvas.style.height=n('canvasH',900)+'px';grid.style.backgroundSize=n('gridSize',20)+'px '+n('gridSize',20)+'px';drawMini()} $('applyCanvasBtn').onclick=applyCanvas;applyCanvas();
imageLoader.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{hallImage.src=ev.target.result;hallImage.onload=()=>{$('canvasW').value=hallImage.naturalWidth;$('canvasH').value=hallImage.naturalHeight;applyCanvas();}};r.readAsDataURL(f)};
function setMode(m){mode.value=m;modeTitle.textContent='Mode: '+m;hint.textContent={seat:'Клик = место. Повторный клик по месту = снять/поставить выделение. Double click = удалить.',row:'Клик по пустому месту = построить ряд.',arc:'Клик = построить дугу.',label:'Клик = поставить подпись.',stage:'Клик = поставить сцену.',path:'Клики = точки контура. Double click = завершить контур.',select:'Потянуть рамку = выделить группу.',move:'Тянуть выделенный элемент = двигать всю группу.'}[m]||''}
mode.onchange=()=>setMode(mode.value);setMode('seat');
function clearDom(){canvas.querySelectorAll('.seat-dot,.seat-label,.decor-label,.decor-stage,.decor-path,.select-box').forEach(x=>x.remove())}
function render(){clearDom();seats.forEach(renderSeat);decor.forEach(renderDecor);paths.forEach(renderPath);counter.innerHTML=`Мест: ${seats.length}<br>Decor: ${decor.length}<br>Paths: ${paths.length}<br>Selected: ${selected.size}`;drawMini()}
function renderSeat(s){if(!s.id)s.id=uid('seat');const d=document.createElement('div');d.className='seat-dot';d.dataset.id=s.id;d.style.left=s.x+'px';d.style.top=s.y+'px';d.style.background=s.color||'#dc2626';if(selected.has(s.id))d.classList.add('selected');if(s.status)d.classList.add(s.status);const l=document.createElement('div');l.className='seat-label';l.style.left=s.x+'px';l.style.top=s.y+'px';l.textContent=s.row+'/'+s.seat;canvas.append(d,l)}
function renderDecor(d){if(!d.id)d.id=uid('decor');const el=document.createElement('div');el.dataset.id=d.id;if(d.type==='stage'){el.className='decor-stage';el.style.left=d.x+'px';el.style.top=d.y+'px';el.style.width=(d.w||420)+'px';el.style.height=(d.h||70)+'px';el.textContent=d.text||'СЦЕНА'}else{el.className='decor-label';el.style.left=d.x+'px';el.style.top=d.y+'px';el.style.transform=`translate(-50%,-50%) rotate(${d.rotate||0}deg)`;el.textContent=d.text||'LABEL'}if(selected.has(d.id))el.classList.add('selected-decor');canvas.append(el)}
function renderPath(p){if(!p.id)p.id=uid('path');if(!p.points||p.points.length<2)return;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('decor-path');svg.dataset.id=p.id;svg.style.left=0;svg.style.top=0;svg.style.width=cw()+'px';svg.style.height=ch()+'px';const poly=document.createElementNS('http://www.w3.org/2000/svg','polyline');poly.setAttribute('points',p.points.map(q=>q.x+','+q.y).join(' '));poly.setAttribute('fill','none');poly.setAttribute('stroke',selected.has(p.id)?'#2563eb':'#111827');poly.setAttribute('stroke-width','4');poly.setAttribute('stroke-linecap','round');poly.setAttribute('stroke-linejoin','round');svg.append(poly);canvas.append(svg)}
function targetId(e){const el=e.target.closest('.seat-dot,.decor-label,.decor-stage,.decor-path');return el?.dataset?.id||null}
function objById(id){return all().find(o=>o.id===id)}
function toggleSelect(id,add){if(!id)return;if(add){selected.has(id)?selected.delete(id):selected.add(id);return} if(selected.has(id)){selected.delete(id)}else{selected.clear();selected.add(id)}}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const id=targetId(e), p=point(e);if(mode.value==='select'&&!id){selected.clear();selectStart=p;selectBox=document.createElement('div');selectBox.className='select-box';selectBox.style.left=p.x+'px';selectBox.style.top=p.y+'px';selectBox.style.width=0;selectBox.style.height=0;canvas.append(selectBox);return} if(mode.value==='move'&&id){if(!selected.has(id)){selected.clear();selected.add(id);render()}drag={start:p, originals:all().filter(o=>selected.has(o.id)).map(o=>({id:o.id,x:o.x,y:o.y,points:o.points?JSON.parse(JSON.stringify(o.points)):null}))};return}});
canvas.addEventListener('pointermove',e=>{const p=point(e);if(selectBox&&selectStart){const left=Math.min(selectStart.x,p.x),top=Math.min(selectStart.y,p.y),w=Math.abs(p.x-selectStart.x),h=Math.abs(p.y-selectStart.y);Object.assign(selectBox.style,{left:left+'px',top:top+'px',width:w+'px',height:h+'px'});return} if(drag){const dx=p.x-drag.start.x,dy=p.y-drag.start.y;drag.originals.forEach(o=>{const ob=objById(o.id);if(!ob)return;if(o.points){ob.points=o.points.map(pt=>({x:snap(pt.x+dx),y:snap(pt.y+dy)}))}else{ob.x=snap(o.x+dx);ob.y=snap(o.y+dy)}});render();return}});
canvas.addEventListener('pointerup',e=>{if(selectBox){const b=selectBox.getBoundingClientRect();canvas.querySelectorAll('.seat-dot,.decor-label,.decor-stage,.decor-path').forEach(el=>{const r=el.getBoundingClientRect();if(r.left>=b.left&&r.right<=b.right&&r.top>=b.top&&r.bottom<=b.bottom)selected.add(el.dataset.id)});selectBox.remove();selectBox=null;selectStart=null;render();return} if(drag){save();drag=null;render();return}});
canvas.addEventListener('click',e=>{const id=targetId(e);if(id){if(mode.value!=='move'){toggleSelect(id,e.shiftKey);render()}return} const p=point(e), m=mode.value;if(m==='select'||m==='move')return;save();if(m==='seat'){addSeat(p.x,p.y);render();return} if(m==='row'){buildRow(p.x,p.y);render();return} if(m==='arc'){buildArc(p.x,p.y);render();return} if(m==='label'){decor.push({id:uid('decor'),type:'label',text:val('decorText')||'LABEL',x:p.x,y:p.y,rotate:n('decorRotate',0)});render();return} if(m==='stage'){decor.push({id:uid('decor'),type:'stage',text:val('decorText')||'СЦЕНА',x:p.x,y:p.y,w:n('stageW',420),h:n('stageH',70)});render();return} if(m==='path'){pathDraft.push({x:p.x,y:p.y});paths=paths.filter(x=>x.id!=='temp_path');if(pathDraft.length>1)paths.push({id:'temp_path',points:pathDraft});log('PATH POINTS: '+pathDraft.length+'. Double click = завершить.');render();return}});
canvas.addEventListener('dblclick',e=>{const id=targetId(e);if(id&&mode.value!=='path'){save();seats=seats.filter(s=>s.id!==id);decor=decor.filter(d=>d.id!==id);paths=paths.filter(p=>p.id!==id);selected.delete(id);render();return} if(mode.value==='path'&&pathDraft.length>1){save();paths=paths.filter(x=>x.id!=='temp_path');paths.push({id:uid('path'),points:pathDraft});pathDraft=[];log('PATH CREATED');render()}});
function addSeat(x,y){const seat=n('seat',1);seats.push({id:uid('seat'),zone:val('zone'),prefix:val('prefix'),row:String(n('row',1)),seat:seat,price:n('price',0),color:val('seatColor')||'#dc2626',x,y});$('seat').value=seat+1}
function buildRow(x,y){const row=String(n('row',1)),start=n('seat',1),count=Math.max(1,n('rowCount',1)),step=Math.max(1,n('seatStep',36)),aisleEvery=Math.max(0,n('aisleEvery',0)),aisleSize=Math.max(0,n('aisleSize',0)),dir=val('direction');for(let i=0;i<count;i++){let gaps=aisleEvery?Math.floor(i/aisleEvery):0;let dx=i*step+gaps*aisleSize;let px=x+dx;if(dir==='left')px=x-dx;if(dir==='center')px=x+(i-(count-1)/2)*step+(i>=count/2?aisleSize/2:-aisleSize/2);seats.push({id:uid('seat'),zone:val('zone'),prefix:val('prefix'),row,seat:start+i,price:n('price',0),color:val('seatColor')||'#dc2626',x:snap(px),y:snap(y)})}$('seat').value=start+count}
function buildArc(x,y){const row=String(n('row',1)),start=n('seat',1),count=Math.max(1,n('rowCount',1)),radius=n('arcRadius',220),angle=n('arcAngle',120),sa=-angle/2;for(let i=0;i<count;i++){const t=count<=1?0:i/(count-1),a=(sa+t*angle)*Math.PI/180;seats.push({id:uid('seat'),zone:val('zone'),prefix:val('prefix'),row,seat:start+i,price:n('price',0),color:val('seatColor')||'#dc2626',x:snap(x+Math.cos(a)*radius),y:snap(y+Math.sin(a)*radius)})}$('seat').value=start+count}
$('gridBtn').onclick=()=>{gridShown=!gridShown;grid.style.display=gridShown?'block':'none';grid.style.backgroundSize=n('gridSize',20)+'px '+n('gridSize',20)+'px'};$('moveBtn').onclick=()=>setMode('move');
$('copyBtn').onclick=()=>{clipboard=all().filter(o=>selected.has(o.id)).map(o=>JSON.parse(JSON.stringify(o)));log('COPIED: '+clipboard.length)};
$('pasteBtn').onclick=()=>{if(!clipboard.length)return;save();selected.clear();clipboard.forEach(o=>{const c=JSON.parse(JSON.stringify(o));c.id=uid(c.points?'path':c.type?'decor':'seat');if(c.points)c.points=c.points.map(p=>({x:p.x+30,y:p.y+30}));else{c.x+=30;c.y+=30}if(c.points)paths.push(c);else if(c.type)decor.push(c);else seats.push(c);selected.add(c.id)});render()};
$('mirrorBtn').onclick=()=>{const list=all().filter(o=>selected.has(o.id));if(!list.length)return;save();selected.clear();list.forEach(o=>{const c=JSON.parse(JSON.stringify(o));c.id=uid(c.points?'path':c.type?'decor':'seat');if(c.points){c.points=c.points.map(p=>({x:cw()-p.x,y:p.y}));paths.push(c)}else{c.x=cw()-c.x;if(c.type)decor.push(c);else seats.push(c)}selected.add(c.id)});render()};
$('numberBtn').onclick=()=>{const list=selSeats().sort((a,b)=>a.y-b.y||a.x-b.x);if(!list.length)return;save();const row=String(n('row',1));let st=n('seat',1);list.forEach((s,i)=>{s.zone=val('zone');s.prefix=val('prefix');s.row=row;s.seat=st+i;s.price=n('price',0);s.color=val('seatColor')||s.color});$('seat').value=st+list.length;render()};
$('deleteBtn').onclick=()=>{if(!selected.size)return;save();seats=seats.filter(s=>!selected.has(s.id));decor=decor.filter(d=>!selected.has(d.id));paths=paths.filter(p=>!selected.has(p.id));selected.clear();render()};
$('undoBtn').onclick=()=>{const p=history.pop();if(!p)return;const d=JSON.parse(p);seats=d.seats||[];decor=d.decor||[];paths=d.paths||[];selected.clear();render()};
$('clearBtn').onclick=()=>{save();seats=[];decor=[];paths=[];selected.clear();pathDraft=[];jsonOutput.value='';render();log('CLEARED')};
function setStatus(st){save();selSeats().forEach(s=>s.status=st);render()} $('holdBtn').onclick=()=>setStatus('hold');$('soldBtn').onclick=()=>setStatus('sold');$('reservedBtn').onclick=()=>setStatus('reserved');$('statusClearBtn').onclick=()=>setStatus('');
function clean(){const seen=new Set();seats=seats.map(s=>({...s,row:String(s.row),seat:Number(s.seat),x:Number(s.x),y:Number(s.y)})).filter(s=>{const k=`${s.prefix}|${s.row}|${s.seat}`;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>String(a.zone).localeCompare(String(b.zone))||Number(a.row)-Number(b.row)||Number(a.seat)-Number(b.seat))}
function exp(){clean();return{version:2,format:'va-hall-studio-stable',title:'Назва залу',width:cw(),height:ch(),seats:seats.map(s=>({...s,key:seatKey(s)})),decor,paths}} $('exportBtn').onclick=()=>{jsonOutput.value=JSON.stringify(exp(),null,2);render()};
$('importBtn').onclick=()=>{try{const d=JSON.parse(jsonOutput.value);save();seats=Array.isArray(d.seats)?d.seats:Array.isArray(d)?d:[];decor=Array.isArray(d.decor)?d.decor:[];paths=Array.isArray(d.paths)?d.paths:[];if(d.width&&d.height){$('canvasW').value=d.width;$('canvasH').value=d.height;applyCanvas()}selected.clear();render();log('IMPORTED OK')}catch(e){alert('JSON не прочитался');console.error(e)}};
$('cleanBtn').onclick=()=>{save();clean();jsonOutput.value=JSON.stringify(exp(),null,2);render();log('JSON CLEANED')};
$('validateBtn').onclick=()=>{const err=[],keys=new Set(),pos=new Set();seats.forEach(s=>{const k=`${s.prefix}|${s.row}|${s.seat}`;if(keys.has(k))err.push('DUPLICATE: '+k);keys.add(k);const p=`${s.x}|${s.y}`;if(pos.has(p))err.push('POSITION OVERLAP: '+p);pos.add(p);if(!s.zone)err.push('EMPTY ZONE: '+k);if(!s.prefix)err.push('EMPTY PREFIX: row '+s.row+' seat '+s.seat)});log(err.length?err.join('
'):'VALIDATION OK')};
$('previewBtn').onclick=()=>{const z={};seats.forEach(s=>{z[s.zone||'—']=(z[s.zone||'—']||0)+1});preview.innerHTML='<b>VA CASH PREVIEW</b><br>Seats: '+seats.length+'<br>Decor: '+decor.length+'<br>Paths: '+paths.length+'<br><br>'+Object.entries(z).map(([k,v])=>k+': '+v).join('<br>')};
$('traceBtn').onclick=()=>{if(!hallImage.src){alert('Сначала загрузите фон');return}const w=hallImage.naturalWidth,h=hallImage.naturalHeight,c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(hallImage,0,0,w,h);const data=ctx.getImageData(0,0,w,h).data,step=Math.max(4,n('traceStep',14)),thr=n('traceThreshold',80),found=[];for(let y=step;y<h-step;y+=step){for(let x=step;x<w-step;x+=step){const i=(y*w+x)*4,lum=(data[i]+data[i+1]+data[i+2])/3;if(lum<thr&&!found.some(p=>Math.hypot(p.x-x,p.y-y)<step*1.7))found.push({x,y})}}save();const start=n('seat',1);found.slice(0,500).forEach((p,i)=>seats.push({id:uid('seat'),zone:val('zone'),prefix:val('prefix'),row:String(n('row',1)),seat:start+i,price:n('price',0),color:val('seatColor')||'#dc2626',x:p.x,y:p.y}));$('seat').value=start+Math.min(found.length,500);render();log('TRACE FOUND: '+found.length+' / ADDED: '+Math.min(found.length,500))};
function drawMini(){const ctx=miniCanvas.getContext('2d'),mw=miniCanvas.width,mh=miniCanvas.height,w=cw(),h=ch(),sc=Math.min(mw/w,mh/h),ox=(mw-w*sc)/2,oy=(mh-h*sc)/2;ctx.clearRect(0,0,mw,mh);ctx.fillStyle='#fff';ctx.fillRect(0,0,mw,mh);ctx.strokeStyle='#d1d5db';ctx.strokeRect(ox,oy,w*sc,h*sc);seats.forEach(s=>{ctx.fillStyle=selected.has(s.id)?'#2563eb':(s.color||'#dc2626');ctx.fillRect(ox+s.x*sc-1,oy+s.y*sc-1,2,2)})}
render();
</script>
