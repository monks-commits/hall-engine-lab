<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Hall Engine Lab</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

<h1>VA Hall Engine Lab</h1>

<div id="hall"></div>

<script type="module">
import { renderHall } from './engine/renderer.js';

//
// 1. Загружаем зал
//
const hall = await fetch('./data/hall/academy.json')
  .then(r => r.json());

//
// 2. Статусы (занятые места)
//
const state = {
  "P1-M1": "taken",
  "P2-M10": "taken",
  "P5-M7": "taken"
};

//
// 3. Загружаем seance (из editor / Supabase)
//
const seance = await fetch('./data/seances/test-seance.json')
  .then(r => r.json());

//
// 4. 🔥 АДАПТЕР (editor → engine)
//
function convertSeance(seance) {
  const prices = [];

  if (!seance.pricing) return { prices: [] };

  for (const key in seance.pricing) {
    const rule = seance.pricing[key];

    const match = key.match(/^P(\d+)-(\d+)$/);
    if (!match) continue;

    const fromRow = Number(match[1]);
    const toRow   = Number(match[2]);

    for (let r = fromRow; r <= toRow; r++) {
      prices.push({
        row: r,
        from: 1,
        to: 100,
        price: rule.price,
        color: rule.color,
        sale: rule.sale
      });
    }
  }

  return {
    prices,
    seat_overrides: seance.seat_overrides || {}
  };
}

//
// 5. Создаём engine-данные
//
const seanceEngine = convertSeance(seance);

console.log('SEANCE RAW:', seance);
console.log('PRICING:', seance.pricing);
console.log('ENGINE DATA:', seanceEngine);

//
// 6. Рендер зала
//
renderHall(
  document.getElementById('hall'),
  hall,
  state,
  {

    // 🔥 ЦЕНЫ + ЦВЕТА + DISABLED
    getSeatMeta: ({ row, seat }) => {

      const seatKey = `P${row}-M${seat}`;

      // override (приоритет)
      if (seanceEngine.seat_overrides?.[seatKey]) {
        const o = seanceEngine.seat_overrides[seatKey];
        return {
          price: o.price || 0,
          color: o.color,
          disabled: o.sale === false
        };
      }

      // правила
      const rule = seanceEngine.prices.find(p =>
        p.row === row &&
        seat >= p.from &&
        seat <= p.to
      );

      return {
        price: rule ? rule.price : 0,
        color: rule?.color,
        disabled: rule?.sale === false
      };
    },

    onSelect: (seats) => {
      console.log('selected:', seats);
    }

  }
);

</script>

</body>
</html>
