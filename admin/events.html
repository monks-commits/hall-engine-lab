<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Події — Билетний відділ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  padding:20px;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:#f1f5f9;
}

h1{margin:0 0 14px}

.list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:14px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
  display:flex;
  flex-direction:column;
  gap:10px;
}

.title{
  font-weight:800;
  font-size:16px;
}

.meta{
  font-size:14px;
  color:#475569;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:auto;
}

button{
  flex:1;
  border:none;
  border-radius:10px;
  padding:10px;
  font-weight:800;
  cursor:pointer;
}

.btn-cash{
  background:#22c55e;
  color:#052e16;
}

.btn-edit{
  background:#e5e7eb;
  color:#111827;
}
</style>
</head>

<body>

<h1>🎟 Події (робочі сеанси)</h1>

<div id="list" class="list">Завантаження…</div>

<script>
const listEl = document.getElementById("list");

async function loadAfisha(){
  try{
    const res = await fetch("../data/afisha.json",{cache:"no-store"});
    if(!res.ok) throw 1;
    const data = await res.json();
    render(data);
  }catch{
    listEl.innerHTML = "<b>❌ Не вдалося завантажити afisha.json</b>";
  }
}

function buildSeanceId(show){
  if(!show.date || !show.time) return "";
  return `${show.id}-${show.date}-${show.time.replace(":","-")}`;
}

function openCash(show){
  const seance = buildSeanceId(show);
  location.href =
    `index.html?mode=cash&show=${show.id}&seance=${seance}`;
}

function openEditor(show){
  const seance = buildSeanceId(show);
  location.href =
    `index.html?mode=create&seance=${seance}`;
}


function render(data){
  if(!Array.isArray(data) || !data.length){
    listEl.innerHTML = "<i>Подій поки що немає</i>";
    return;
  }

  listEl.innerHTML = "";

  data.forEach(show=>{
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="title">${show.title || show.id}</div>
      <div class="meta">
        ${show.date || "—"} ${show.time || ""}
      </div>

      <div class="actions">
        <button class="btn-cash">КАСА</button>
        <button class="btn-edit">СТВОРЕННЯ</button>
      </div>
    `;

    card.querySelector(".btn-cash").onclick = ()=>openCash(show);
    card.querySelector(".btn-edit").onclick = ()=>openEditor(show);

    listEl.appendChild(card);
  });
}

loadAfisha();
</script>

</body>
</html>
