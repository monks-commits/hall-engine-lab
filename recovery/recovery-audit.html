<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>VA Recovery Audit</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="./recovery-config.js"></script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#061a3a;
  color:#fff;
}

.wrap{
  max-width:1100px;
  margin:0 auto;
  padding:32px 24px;
}

h1{
  margin:0 0 8px;
  font-size:42px;
}

p{
  color:#b8c4d6;
}

.card{
  background:#1d2d47;
  border-radius:24px;
  padding:24px;
  box-shadow:0 18px 40px rgba(0,0,0,.22);
  margin-top:20px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:18px 0;
}

button,a.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  min-height:44px;
  padding:0 16px;
  border:none;
  border-radius:14px;
  font:inherit;
  font-weight:800;
  cursor:pointer;
}

.btn-primary{
  background:#4c86f7;
  color:#fff;
}

.btn-neutral{
  background:#e5e7eb;
  color:#111827;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:14px;
}

th,td{
  text-align:left;
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,.12);
  vertical-align:top;
}

th{
  color:#b8c4d6;
  font-size:13px;
  text-transform:uppercase;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  font-weight:800;
  font-size:12px;
}

.badge-ok{
  background:#14532d;
  color:#bbf7d0;
}

.badge-bad{
  background:#7f1d1d;
  color:#fecaca;
}

.badge-warn{
  background:#78350f;
  color:#fde68a;
}

.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:18px;
}

.stat{
  background:#223552;
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  padding:16px;
}

.stat small{
  color:#b8c4d6;
  display:block;
  margin-bottom:8px;
}

.stat strong{
  font-size:28px;
}

@media(max-width:760px){
  .summary{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <h1>📋 VA Recovery Audit</h1>
  <p>
    Журнал компенсаційних проходів: успішні проходи,
    повторні спроби та невідомі квитки.
  </p>

  <div class="actions">
    <button class="btn-primary" onclick="loadAudit()">Оновити журнал</button>
    <a class="btn btn-neutral" href="./cabinet.html">← Cabinet</a>
    <a class="btn btn-neutral" href="./recovery-scanner.html">Scanner</a>
  </div>

  <section class="summary">
    <div class="stat">
      <small>Усього подій</small>
      <strong id="totalCount">—</strong>
    </div>

    <div class="stat">
      <small>Успішні проходи</small>
      <strong id="okCount">—</strong>
    </div>

    <div class="stat">
      <small>Повторні спроби</small>
      <strong id="usedCount">—</strong>
    </div>

    <div class="stat">
      <small>Невідомі квитки</small>
      <strong id="badCount">—</strong>
    </div>
  </section>

  <section class="card">
    <h2>Журнал</h2>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Час</th>
            <th>Token</th>
            <th>Результат</th>
            <th>Контролер</th>
            <th>Дія</th>
          </tr>
        </thead>

        <tbody id="auditBody">
          <tr>
            <td colspan="5">Натисніть “Оновити журнал”.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

</div>

<script src="./recovery-audit.js"></script>
</body>
</html>
