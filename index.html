<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Hall Engine Lab</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

<h1>VA Hall Engine Lab</h1>

<div id="hall"></div>

<script type="module">
import { renderHall } from './engine/renderer.js';

const hall = await fetch('./data/hall/academy.json')
  .then(r => r.json());

const state = {
  "P1-M1": "taken",
  "P2-M10": "taken",
  "P5-M7": "taken"
};

const seance = await fetch('./data/seances/test-seance.json')
  .then(r => r.json());
  
renderHall(
  document.getElementById('hall'),
  hall,
  state,
  {
    getSeatMeta: ({ row, seat }) => {

  const seatKey = `P${row}-M${seat}`;

  // 1. override (приоритет)
  if (seance.seat_overrides?.[seatKey]) {
    const o = seance.seat_overrides[seatKey];
    return {
      price: o.price || 0,
      className: o.sale === false ? 'disabled' : ''
    };
  }

  // 2. правила pricing
  for (const key in seance.pricing) {
    const match = key.match(/^P(\d+)-(\d+)$/);
    if (!match) continue;

    const from = Number(match[1]);
    const to   = Number(match[2]);

    if (row >= from && row <= to) {
      const r = seance.pricing[key];
      return {
        price: r.price,
        className: r.sale === false ? 'disabled' : ''
      };
    }
  }

  // 3. fallback
  return {
    price: 0
  };
},

 

  return {
  price: 0
};
},

    onSelect: (seats) => {
      console.log('selected:', seats);
    }
  }
);
</script>
</body>
</html>
