<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>VA Recovery Scanner</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="./recovery-config.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#061a3a;color:#fff}
.wrap{max-width:720px;margin:0 auto;padding:24px}
.card{background:#1d2d47;border-radius:24px;padding:22px;box-shadow:0 18px 40px rgba(0,0,0,.22)}
h1{margin:0 0 10px;font-size:34px}p{color:#b8c4d6}
label{display:block;margin-top:12px}
input,select{width:100%;box-sizing:border-box;margin-top:10px;border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 16px;background:#10233f;color:#fff;font:inherit}
select:disabled,input:disabled{opacity:.62}
.mode-box{margin-top:18px;padding:16px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(6,26,58,.32)}
.mode-title{font-weight:800;margin-bottom:4px}.mode-hint{margin-top:8px;color:#b8c4d6;font-size:14px;line-height:1.4}
#reader{position:relative;width:100%;min-height:280px;margin:18px 0;background:#000;border-radius:18px;overflow:hidden}
#reader:empty{min-height:0;margin:0}
#reader video{display:block!important;width:100%!important;height:auto!important;min-height:280px!important;object-fit:cover!important;background:#000!important;opacity:1!important;visibility:visible!important}
#reader canvas{max-width:100%!important}#reader img{display:none!important}
.status{margin-top:18px;padding:18px;border-radius:18px;background:#223552;border:1px solid rgba(255,255,255,.12)}
.status.ok{background:#14532d}.status.bad{background:#7f1d1d}.status.warn{background:#78350f}
.status-title{font-size:26px;font-weight:800;margin-bottom:8px}.status-details{color:#e5e7eb;line-height:1.45}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
button{border:none;border-radius:14px;padding:12px 16px;font:inherit;cursor:pointer;font-weight:800}button:disabled{opacity:.55;cursor:default}
.btn-start{background:#22c55e;color:#08111f}.btn-stop{background:#ef4444;color:#fff}
.token{margin-top:12px;font-size:12px;color:#b8c4d6;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
  <h1>🟡 VA Recovery Scanner</h1>
  <p>Сканер компенсаційного доступу. Перед запуском камери оберіть сеанс погашення або режим перевірки без погашення.</p>
  <div class="card">
    <label for="gate">Контролер / вхід</label>
    <input id="gate" value="recovery-gate-1">
    <label for="secret">Scanner secret</label>
    <input id="secret" type="text" placeholder="SCANNER_SECRET">
    <div class="mode-box">
      <div class="mode-title">Режим / сеанс погашення</div>
      <select id="targetSeance" disabled>
        <option value="">Завантаження сеансів...</option>
      </select>
      <div id="modeHint" class="mode-hint">Дочекайтеся завантаження та оберіть режим роботи.</div>
    </div>
    <div class="controls">
      <button class="btn-start" id="btnStart" disabled>Запустити камеру</button>
      <button class="btn-stop" id="btnStop" disabled>Зупинити</button>
    </div>
    <div id="reader"></div>
    <div id="status" class="status">
      <div id="statusTitle" class="status-title">Завантаження</div>
      <div id="statusDetails" class="status-details">Завантажую доступні сеанси.</div>
      <div id="tokenText" class="token">—</div>
    </div>
  </div>
</div>
<script src="./recovery-scanner.js?v=seance-choice-01"></script>
</body>
</html>
