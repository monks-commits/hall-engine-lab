<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Створення сеансу — білетний відділ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="../styles.css">

<style>
.page-wrap{padding:20px;max-width:1200px;margin:auto}
.card{
  background:#fff;border-radius:14px;padding:16px;margin-bottom:16px;
  box-shadow:0 4px 14px rgba(0,0,0,.06);
}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
label{font-size:13px;color:#374151}
input,select{
  padding:8px 10px;border-radius:8px;border:1px solid #d1d5db;
}
h1{margin-bottom:10px}
h3{margin:0 0 10px}
.btn{
  padding:10px 16px;border-radius:12px;border:none;
  font-weight:800;cursor:pointer
}
.btn-primary{background:#111827;color:#fff}
.btn-ghost{background:#f3f4f6}
.badge{
  padding:4px 10px;border-radius:999px;font-size:12px;
  background:#e5e7eb
}
.badge.ready{background:#bbf7d0}
.section-actions{display:flex;gap:10px;flex-wrap:wrap}
iframe{
  width:100%;height:520px;border:1px solid #e5e7eb;
  border-radius:12px;background:#f9fafb
}
</style>
</head>

<body>

<div id="admin-header"></div>

<main class="page-wrap">
  <h1>🛠 Створення сеансу</h1>

  <!-- 1. Seance data -->
  <div class="card">
    <h3>1️⃣ Дані сеансу</h3>

    <div class="row">
      <label>
        Подія
        <select id="eventSlug">
          <option value="">Вибрати подію…</option>
          <option value="koncert">koncert</option>
          <option value="vistava">vistava</option>
        </select>
      </label>

      <label>
        Дата
        <input type="date" id="eventDate">
      </label>

      <label>
        Час
        <input type="time" id="eventTime">
      </label>

      <label>
        Seance ID
        <input type="text" id="seanceId" placeholder="auto" disabled>
      </label>

      <span id="statusBadge" class="badge">чернетка</span>
    </div>

    <!-- STATUS CONTROL -->
    <div class="row" style="margin-top:10px">
      <label>
        Статус сеансу
        <select id="seanceStatus">
          <option value="draft">Чернетка</option>
          <option value="ready">Готовий</option>
        </select>
      </label>

      <button class="btn btn-ghost" onclick="setReady()">Зробити готовим</button>
    </div>
  </div>

  <!-- 2. Hall -->
  <div class="card">
    <h3>2️⃣ Зал</h3>
    <div class="section-actions">
      <button class="btn btn-primary">Відкрити схему залу</button>
      <button class="btn btn-ghost">Перевірити розміри</button>
    </div>
  </div>

  <!-- 3. Pricing -->
  <div class="card">
    <h3>3️⃣ Ціни та кольори</h3>
    <!-- embed later -->
    <iframe src="../../seance-editor.html?embed=1"></iframe>
  </div>

  <!-- 4. Save -->
  <div class="card">
    <h3>4️⃣ Збереження</h3>
    <div class="section-actions">
      <button class="btn btn-primary" onclick="saveSeance()">💾 Зберегти</button>
      <button class="btn btn-ghost">Опублікувати</button>
      <button class="btn btn-ghost">Скасувати</button>
    </div>
  </div>
</main>

<script>
/* -------------------------
   STATE
--------------------------*/
const seance = {
  event: "",
  date: "",
  time: "",
  seance_id: "",
  status: "draft"
};

/* -------------------------
   HELPERS
--------------------------*/
function updateSeanceId(){
  if (!seance.event || !seance.date || !seance.time) return;
  const t = seance.time.replace(":","-");
  seance.seance_id = `${seance.event}-${seance.date}-${t}`;
  document.getElementById("seanceId").value = seance.seance_id;
}

function updateStatusUI(){
  const badge = document.getElementById("statusBadge");
  badge.textContent = seance.status === "ready" ? "готовий" : "чернетка";
  badge.classList.toggle("ready", seance.status === "ready");
  document.getElementById("seanceStatus").value = seance.status;
}

/* -------------------------
   ACTIONS
--------------------------*/
function setReady(){
  seance.status = "ready";
  updateStatusUI();
}

function saveSeance(){
  const payload = {
    seance_id: seance.seance_id,
    status: seance.status
  };
  console.log("SAVE SEANCE:", payload);
  alert("Сеанс збережено (поки що локально)");
}

/* -------------------------
   EVENTS
--------------------------*/
document.getElementById("eventSlug").onchange = e=>{
  seance.event = e.target.value;
  updateSeanceId();
};
document.getElementById("eventDate").onchange = e=>{
  seance.date = e.target.value;
  updateSeanceId();
};
document.getElementById("eventTime").onchange = e=>{
  seance.time = e.target.value;
  updateSeanceId();
};
document.getElementById("seanceStatus").onchange = e=>{
  seance.status = e.target.value;
  updateStatusUI();
};

/* -------------------------
   HEADER
--------------------------*/
fetch("../index.html")
  .then(r=>r.text())
  .then(html=>{
    document.getElementById("admin-header").innerHTML = html;
  });

updateStatusUI();
</script>

</body>
</html>
