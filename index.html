<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Hall Engine Lab</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

<h1>VA Hall Engine Lab</h1>

<div id="hall"></div>

<script type="module">
import { renderHall } from './engine/renderer.js';

const hall = await fetch('./data/hall/academy.json')
  .then(r => r.json());

const state = {
  "P1-M1": "taken",
  "P2-M10": "taken",
  "P5-M7": "taken"
};

const seance = await fetch('./data/seances/test-seance.json')
  .then(r => r.json());

function convertSeance(seance) {
  const prices = [];

  if (!seance.pricing) return { prices: [] };

  for (const key in seance.pricing) {

    const rule = seance.pricing[key];

    // 🔥 ПАРСИМ P1-3
    const match = key.match(/^P(\d+)-(\d+)$/);

    if (!match) {
      console.warn('BAD KEY:', key);
      continue;
    }

    const fromRow = Number(match[1]);
    const toRow   = Number(match[2]);

    for (let r = fromRow; r <= toRow; r++) {
      prices.push({
        row: r,
        from: 1,
        to: 100,
        price: rule.price,
        color: rule.color,
        sale: rule.sale
      });
    }
  }

  console.log('ADAPTER RESULT:', prices); // 👈 ВАЖНО

  return { prices };
}
  
renderHall(
  document.getElementById('hall'),
  hall,
  state,
  {

    getSeatMeta: ({ row, seat }) => {

  const rule = seanceEngine.prices.find(p =>
    (p.row === row || p.row === "*") &&
    seat >= p.from &&
    seat <= p.to
  );

  return {
    price: rule ? rule.price : 0,
    disabled: rule?.sale === false,
    color: rule?.color || null
  };
},

    onSelect: (seats) => {
      console.log('selected:', seats); 
    }

  }
);
</script>

</body>
</html>
