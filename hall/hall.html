<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Схема залу</title>

  <link rel="stylesheet" href="../styles.css" />

  <style>
    .hall-layout{display:flex;gap:24px;align-items:flex-start;}
    .hall-left{flex:1 1 auto;min-width:0;}
    .hall-sidebar{width:280px;flex:0 0 280px;}

    .hall-scroll{
      background:#e5e7eb;border-radius:16px;padding:12px;
      overflow-x:auto;-webkit-overflow-scrolling:touch;
    }
    .hall-inner{width:max(980px,100%);}

    .row-line{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
    .row-label{width:22px;text-align:right;font-size:11px;color:#6b7280;}
    .seats-row{display:flex;gap:4px;}

    .seat{
      width:24px;height:24px;border-radius:6px;
      border:1px solid #d1d5db;background:#fff;
      font-size:11px;display:flex;align-items:center;justify-content:center;
      cursor:pointer;
    }

    .seat--parter-front{background:#fef9c3;}
    .seat--parter-mid{background:#dbeafe;}
    .seat--parter-back{background:#e5e7eb;}
    .seat--parter-red{background:#fecaca;}

    .seat--amphi{background:#e0f2fe;}
    .seat--balcony{background:#f3e8ff;}
    .seat--lodge{background:#fee2e2;}

    .seat--selected{background:#2563eb!important;color:#fff;}
    .seat--taken{background:#9ca3af!important;color:#fff;cursor:not-allowed;}

    .seat--gap-right{margin-right:16px;}
  </style>
</head>

<body>
<div class="container">
<h1>Схема залу</h1>

<div class="hall-scroll">
<div class="hall-inner">
  <div id="parter-block"></div>
</div>
</div>
</div>

<script>
/**
 * ================================
 * HALL PROFILE (ЦЕНЫ + ЦВЕТА)
 * ================================
 */
window.HALL_PROFILE = {
  getSeatStyle({ zone, row }) {
    if (zone === "Партер") {
      if (row <= 2) {
        return { price: 300, className: "seat--parter-red" };
      }
      if (row <= 6)  return { price: 200, className: "seat--parter-front" };
      if (row <= 12) return { price: 160, className: "seat--parter-mid" };
      return { price: 140, className: "seat--parter-back" };
    }
    return null;
  }
};

/**
 * ================================
 * HALL ENGINE ADAPTER
 * ================================
 */
function hallResolveSeatStyle({ zone, row, fallback }) {
  if (!window.HALL_PROFILE) return fallback;
  return window.HALL_PROFILE.getSeatStyle({ zone, row }) || fallback;
}

/**
 * ================================
 * DATA
 * ================================
 */
const parterRows = Array.from({ length: 18 }, (_, i) => {
  const row = i + 1;

  const fallback = {
    price: row <= 6 ? 200 : (row <= 12 ? 160 : 140),
    className:
      row <= 6 ? "seat--parter-front"
      : row <= 12 ? "seat--parter-mid"
      : "seat--parter-back"
  };

  const resolved = hallResolveSeatStyle({
    zone: "Партер",
    row,
    fallback
  });

  return {
    row,
    seats: 20,
    zone: "Партер",
    price: resolved.price,
    className: resolved.className
  };
});

/**
 * ================================
 * RENDER
 * ================================
 */
function renderParter(){
  const block = document.getElementById("parter-block");
  block.innerHTML = "";

  parterRows.forEach(r=>{
    const line = document.createElement("div");
    line.className = "row-line";

    const label = document.createElement("div");
    label.className = "row-label";
    label.textContent = r.row;
    line.appendChild(label);

    const seats = document.createElement("div");
    seats.className = "seats-row";

    for(let s=1;s<=r.seats;s++){
      const btn = document.createElement("div");
      btn.className = "seat " + r.className + (s===10?" seat--gap-right":"");
      btn.textContent = s;
      seats.appendChild(btn);
    }

    line.appendChild(seats);
    block.appendChild(line);
  });
}

renderParter();
</script>
</body>
</html>
