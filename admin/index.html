<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Admin — Билетний відділ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html,body{
  margin:0;
  padding:0;
  height:100%;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:#0f172a;
}

.header{
  display:flex;
  gap:12px;
  padding:10px 14px;
  background:#020617;
  border-bottom:1px solid #1e293b;
}

.header button{
  background:#111827;
  color:#e5e7eb;
  border:1px solid #1e293b;
  border-radius:10px;
  padding:8px 14px;
  font-weight:800;
  cursor:pointer;
}

.header button.active{
  background:#22c55e;
  color:#052e16;
  border-color:#22c55e;
}

iframe{
  width:100%;
  height:calc(100vh - 56px);
  border:0;
  background:#f1f5f9;
}
</style>
</head>

<body>

<div class="header">
  <button onclick="go('events.html',this)">Події</button>
  <button onclick="go('create.html',this)">Створення</button>
  <button onclick="go('reports.html',this)">Звіти</button>
  <button onclick="go('docs.html',this)">Документи</button>
</div>

<iframe id="frame"></iframe>

<script>
const frame = document.getElementById("frame");

function go(page, btn){
  document.querySelectorAll(".header button")
    .forEach(b=>b.classList.remove("active"));

  btn.classList.add("active");
  frame.src = page;
}

// старт по умолчанию
go("events.html", document.querySelectorAll("button")[0]);
</script>

</body>
</html>
