<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Hall Engine Lab</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

<h1>VA Hall Engine Lab</h1>

<div id="hall"></div>

<script type="module">
import { renderHall } from './engine/renderer.js';

const hall = await fetch('./data/hall/academy.json')
  .then(r => r.json());

const state = {
  "P1-M1": "taken",
  "P2-M10": "taken",
  "P5-M7": "taken"
};

renderHall(
  document.getElementById('hall'),
  hall,
  state,
  {
    // 👇 ВОТ ЭТО ДОБАВЛЯЕМ
    getSeatMeta: ({ row, seat }) => {
      // простая логика для теста
      let price = 0;

      if (row <= 5) price = 200;
      else if (row <= 10) price = 150;
      else price = 100;

      return {
        price,
        className: 'price-zone'
      };
    },

    onSelect: (seats) => {
      console.log('selected:', seats);
    }
  }
);
</script>
</body>
</html>
